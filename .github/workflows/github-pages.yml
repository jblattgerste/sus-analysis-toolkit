name: Static Site on GitHub Pages

# Builds a static version of the toolkit that runs its Python code in the browser (Pyodide) and publishes it
# on GitHub Pages.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        # Same Python version as the Pyodide release used by the static site
        python-version: '3.12'
        cache: pip

    - name: Install dependencies
      run: python -m pip install -r requirements.txt

    - name: Build static site
      run: python static_site/build.py --out _site --base-path "/${{ github.event.repository.name }}/"

    - uses: actions/upload-pages-artifact@v3
      with:
        path: _site

    - id: deployment
      uses: actions/deploy-pages@v4
